services:
  backend:
    build:
      context: ./backend

    environment:
      LLM_API_KEY: ${LLM_API_KEY:-${GEMINI_API_KEY:-}}
      LLM_MODEL: ${LLM_MODEL:-${GEMINI_MODEL:-gemini-3.5-flash-lite}}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-${GEMINI_TIMEOUT:-25s}}
      GEMINI_API_KEY: ${LLM_API_KEY:-${GEMINI_API_KEY:-}}
      GEMINI_MODEL: ${LLM_MODEL:-${GEMINI_MODEL:-gemini-3.5-flash-lite}}
      GEMINI_TIMEOUT: ${LLM_TIMEOUT:-${GEMINI_TIMEOUT:-25s}}
    restart: unless-stopped
    stop_grace_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
